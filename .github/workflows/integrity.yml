name: landing-integrity
on: [push]
jobs:
  zero-external:
    runs-on: [self-hosted, dallas]
    steps:
      - uses: actions/checkout@v4
      - name: no external requests beyond t.me deep-link
        run: |
          BAD=$(grep -oE 'https?://[^"'"'"']+' index.html | grep -v 't.me/rateguardian_bot' || true)
          if [ -n "$BAD" ]; then echo "EXTERNAL REQUESTS FOUND: $BAD"; exit 1; fi
